name: Manual Apply

on:
  workflow_dispatch:
    inputs:
      working-directory:
        description: "Working Directory"
        required: true
        default: "env/staging/monitors/alarms"
        type: string

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  terraform-plan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: ["${{ inputs.working-directory }}"]
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Setup
        uses: ./.github/actions/setup
        with:
          type: "cd"
          gh_app_id: ${{ secrets.APP_ID }}
          gh_app_private_key: ${{ secrets.APP_PEM }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -input=false

  terraform-apply:
    needs: [terraform-plan]
    environment:
      name: apply
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: ["${{ inputs.working-directory }}"]
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Setup
        uses: ./.github/actions/setup
        with:
          type: "cd"
          gh_app_id: ${{ secrets.APP_ID }}
          gh_app_private_key: ${{ secrets.APP_PEM }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve