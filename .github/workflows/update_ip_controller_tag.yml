name: Update IP Controller Tag

on:
  repository_dispatch:
    types: [ip_controller_updated]

permissions:
  contents: write
  pull-requests: write

jobs:
  update-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout nlobby-test Repo
        uses: actions/checkout@v4

      - name: Update Tag in Terraform File
        run: |
          NEW_TAG="${{ github.event.client_payload.tag }}"
          echo "New tag received: ${NEW_TAG}"

          TARGET_FILE=(
            "modules/services/api/locals.tf"
            "modules/services/frontend/locals.tf"
          )

          if [ -f "$TARGET_FILE" ]; then
            sed -i -E "s/(ip_controller_version\s*=\s*\")[^\"]+(\")/\1${NEW_TAG}\2/g" $TARGET_FILE
          else
            echo "Warning: Target file $TARGET_FILE not found. Skipping sed replace."
          fi

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update ip_controller to ${{ github.event.client_payload.tag }}"
          title: "🤖 [Automated] Update ip_controller tag to ${{ github.event.client_payload.tag }}"
          body: |
            `ip_controller` リポジトリで新しいタグが切られたため、自動的にバージョンを更新しました。
            - **新バージョン:** `${{ github.event.client_payload.tag }}`
          branch: "automation/update-ip-controller-${{ github.event.client_payload.tag }}"
          base: main
          delete-branch: true