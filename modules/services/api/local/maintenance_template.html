<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メンテナンス中 - Service Unavailable</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #d9534f;
        }
        img {
            max-width: 150px;
            margin-bottom: 20px;
        }
        .retry {
            margin-top: 20px;
            font-size: 1.1em;
            color: #777;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://nlobby-test-ao-staging-maintenance-assets-s3-bucket-01.s3.ap-northeast-1.amazonaws.com/logo.png" alt="メンテナンスロゴ">
        <h1>メンテナンス作業中です (Service Unavailable)</h1>
        <p>
            現在、システム安定化のため、計画的なメンテナンスを実施しております。<br>
            ご迷惑をおかけし、大変申し訳ございません。
        </p>
        <p>
            メンテナンス終了まで、しばらくお待ちください。
        </p>
        <p class="retry">
            復旧まで残り約 **RETRY_TIME** です。
        </p>
        <hr>
        <small>HTTP 503 Service Unavailable by AWS WAF</small>
    </div>
</body>
</html>
