<!doctype html>
<html>
  <head>
    <meta http-equiv="content-type" charset="UTF-8">
    <title>Site Maintenance</title>
  </head>
  <style type="text/css">
  .box1 {
    color: #000000;
    font-weight: bold;
    border: solid 2px #130012;
    margin: 3em 0 1em 0;
    border-radius: 6px;
    background: #feffff;
    padding: 22px 8px 22px 8px;
    line-height: 2;
  }
  .box1-title {
    border-bottom: solid 2px #130012;
    font-size: 1.2em;
    background: repeating-linear-gradient(-45deg, #d3a129 , #d3a129  12px,#130012 12px, #130012 28px);
    color: #feffff;
    padding: 4px;
    text-align: center;
    font-weight: bold;
    letter-spacing: 0.05em;
    margin: -22px -8px 22px -8px;
    border-radius: 6px 6px 0 0;
  }
  .box1 p {
    margin: 0;
    padding: 0;
  }
  </style>

  <body>
    <div class="box1">
      <div class="box1-title">工事中</div>
      <center>こちらは現在通行不可となっております </center>
      </div>
  </body>
</html>
